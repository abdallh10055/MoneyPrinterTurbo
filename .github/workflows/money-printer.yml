name: Run Money Printer Turbo

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو'
        required: true
        default: 'قصص نجاح'
        type: string
      audio_file:
        description: 'اسم ملف الصوت داخل مجلد src'
        required: true
        default: 'audio.mp3'
        type: string

jobs:
  build-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Generation
        run: |
          python cli.py --subject "${{ github.event.inputs.topic }}" --audio-path "src/${{ github.event.inputs.audio_file }}"
        env:
          # هنا نقرأ المفاتيح السرية بأمان من إعدادات مستودعك
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # 3. خطوة الحفظ (رفع الفيديو الناتج ليظهر لك لتحميله)
      - name: Upload Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/*.mp4  # (المسار الافتراضي لحفظ الفيديوهات في الأداة)
