name: Run Money Printer Turbo with Pexels & Custom Audio

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو أو الكلمات المفتاحية'
        required: true
        default: 'قصص تاريخية ومذهلة'
        type: string
      
      audio_file:
        description: 'اسم ملف الصوت (مثلاً: a5.m4a)'
        required: true
        default: 'a5.m4a'
        type: string

jobs:
  build-and-generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # خطوة إضافية ذكية: تحديث ملف الإعدادات وتوجيهه لاستخدام Gemini والنموذج المطلوب
      - name: Configure LLM Settings
        run: |
          if [ -f config.example.toml ]; then
            cp config.example.toml config.toml
          fi
          # كتابة الإعدادات داخل ملف التكوين لضمان قرائتها من قبل الأداة
          echo -e "\n[llm]\nprovider = \"gemini\"\nmodel = \"gemini-3.1-flash-lite\"\n" >> config.toml

      - name: Run Video Generation Script
        run: |
          echo "بدء عملية توليد الفيديو عبر Pexels باستخدام Gemini..."
          echo "الموضوع: ${{ github.event.inputs.topic }}"
          echo "ملف الصوت: ${{ github.event.inputs.audio_file }}"
          
          python cli.py --video-subject "${{ github.event.inputs.topic }}" --custom-audio-file "${{ github.event.inputs.audio_file }}" --video-source pexels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-output-video
          path: output/*.mp4
