name: Run Money Printer Turbo with Images & Custom Audio

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو أو الكلمات المفتاحية'
        required: true
        default: 'قصص تاريخية ومذهلة'
        type: string
      
      audio_file:
        description: 'اسم ملف الصوت (مثلاً: a10.m4a)'
        required: true
        default: 'a10.m4a'
        type: string

jobs:
  build-and-generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Video Generation Script
        run: |
          echo "بدء عملية توليد الفيديو بالصور فقط..."
          echo "الموضوع: ${{ github.event.inputs.topic }}"
          echo "ملف الصوت: ${{ github.event.inputs.audio_file }}"
          
          # أضفنا هنا المعامل الخاص بالصور (يمكنك تعديل المعامل بناءً على وثائق الأداة إن وجد، أو الاعتماد على إعدادات الـ config)
          python cli.py --subject "${{ github.event.inputs.topic }}" --audio-path "${{ github.event.inputs.audio_file }}" --material-type "images"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LLM_PROVIDER: "gemini"
          GEMINI_MODEL: "gemini-3.1-flash-lite"

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-output-video
          path: output/*.mp4
