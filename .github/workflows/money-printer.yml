name: Run Money Printer Turbo with Pexels & Custom Audio

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو أو الكلمات المفتاحية'
        required: true
        default: 'قصص تاريخية ومذهلة'
        type: string
      
      audio_file:
        description: 'اسم ملف الصوت (مثلاً: a5.m4a)'
        required: true
        default: 'a5.m4a'
        type: string

jobs:
  build-and-generate-video:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع إلى سيرفر GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تثبيت لغة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. تثبيت المكتبات والمتطلبات الخاصة بالأداة
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. تشغيل الأداة باستخدام المعاملات الصحيحة ومصدر Pexels
      - name: Run Video Generation Script
        run: |
          echo "بدء عملية توليد الفيديو عبر Pexels..."
          echo "الموضوع: ${{ github.event.inputs.topic }}"
          echo "ملف الصوت: ${{ github.event.inputs.audio_file }}"
          
          python cli.py --video-subject "${{ github.event.inputs.topic }}" --custom-audio-file "${{ github.event.inputs.audio_file }}" --video-source pexels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LLM_PROVIDER: "gemini"
          GEMINI_MODEL: "gemini-3.1-flash-lite"

      # 5. خطوة حفظ ورفع الفيديو الناتج لتحميله
      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-output-video
          path: output/*.mp4
