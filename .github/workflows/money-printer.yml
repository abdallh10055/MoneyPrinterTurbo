name: Run Money Printer Turbo with Custom Audio

# 1. تحديد زر التشغيل اليدوي والمدخلات
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع الفيديو أو الكلمات المفتاحية'
        required: true
        default: 'قصص نجاح ملهمة'
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      # 2. سحب كود المستودع إلى سيرفر GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3. تثبيت لغة بايثون في السيرفر
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. تثبيت المكتبات المطلوبة الخاصة بالأداة
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. تشغيل الأداة باستخدام ملف التشغيل البرمجي وتمرير المدخلات
      - name: Run Money Printer Script
        run: |
          echo "جاري إنشاء الفيديو للموضوع: ${{ github.event.inputs.topic }}"
          # هنا سنقوم لاحقاً بتمرير الأمر الخاص بملف cli.py مع ملف الصوت الخاص بك
          python cli.py --subject "${{ github.event.inputs.topic }}"
